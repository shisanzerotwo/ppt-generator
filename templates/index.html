<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT 制作台</title>
<style>
  :root {
    --bg:#fafafa; --panel:#ffffff; --card:#ffffff; --border:#e5e7eb;
    --fg:#111827; --muted:#6b7280; --accent:#4f46e5; --ok:#16a34a;
    --warn:#d97706; --danger:#dc2626;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Inter","Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:rgba(79,70,229,.15); }
  button, input, select, textarea { font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }

  /* ===== 顶栏 ===== */
  .topbar { background:var(--panel); padding:14px 28px; display:flex; align-items:center;
            gap:12px; border-bottom:1px solid var(--border); position:sticky; top:0;
            z-index:10; flex-wrap:wrap; }
  .topbar h1 { font-size:18px; font-weight:700; letter-spacing:-.01em; margin:0 16px 0 0; white-space:nowrap;
               color:var(--fg); display:flex; align-items:center; gap:8px; }
  .topbar h1 .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .topbar input#topic { flex:1; min-width:200px; padding:10px 14px; font-size:15px; color:var(--fg);
                        background:#fff; border:1px solid var(--border); border-radius:10px;
                        transition:border-color .15s ease, box-shadow .15s ease; }
  .topbar input#topic::placeholder { color:var(--muted); }
  .topbar input#topic:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
  .topbar select { padding:9px 11px; color:var(--fg); background:#fff;
                   border:1px solid var(--border); border-radius:10px; font-size:14px; }

  /* ===== 按钮 ===== */
  button { padding:9px 16px; border:none; border-radius:10px; font-size:14px; cursor:pointer;
           transition:background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .btn-primary { background:var(--accent); color:#fff; font-weight:600; }
  .btn-primary:not(:disabled):hover { background:#4338ca; }
  .btn-outline { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn-outline:not(:disabled):hover { background:rgba(79,70,229,.07); }
  .btn-sm { padding:5px 12px; font-size:13px; border-radius:8px; }

  /* ===== 主区 ===== */
  .main { max-width:1120px; margin:0 auto; padding:28px 28px 64px; }

  /* ===== 进度区 ===== */
  .progress { background:var(--panel); border:1px solid var(--border); border-radius:12px;
              padding:16px 20px; margin-bottom:28px; }
  .steps { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .step { padding:5px 14px; border-radius:999px; font-size:13px; color:var(--muted);
          background:var(--bg); border:1px solid transparent; }
  .step.active { color:var(--accent); background:rgba(79,70,229,.08); font-weight:600; }
  .step.done { color:var(--ok); background:rgba(22,163,74,.08); }
  .step.done::before { content:"✓"; margin-right:5px; color:var(--ok); }
  #log { font-size:13px; color:var(--muted); max-height:120px; overflow-y:auto; line-height:1.7;
         font-variant-numeric:tabular-nums; }
  #log div { padding:1px 0; }

  /* ===== 页面卡片 ===== */
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          margin-bottom:20px; overflow:hidden; transition:border-color .15s ease; }
  .card:hover { border-color:#d1d5db; }
  .card-head { padding:10px 18px; font-size:14px; color:var(--fg); border-bottom:1px solid var(--border);
               display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-body { padding:20px; display:flex; gap:22px; }
  .card-body.cover { flex-direction:column; align-items:center; padding:36px 20px; }

  /* 预览卡片内部（按 PPT 主题色，深色"画布"贴纸感，与浅色壳对比） */
  #cards { --deck-bg:#1a1d26; --deck-fg:#e8eaf0; --deck-muted:#8b93a3; --deck-accent:#4f46e5; }
  .card.themed { background:var(--deck-bg); color:var(--deck-fg); box-shadow:0 8px 28px rgba(17,24,39,.12); }
  .card.themed .card-head { color:var(--deck-fg); border-bottom:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); }
  .card.themed:hover { border-color:var(--deck-accent); }
  .card.themed .card-body { border-left:5px solid var(--deck-accent); }
  .card.themed input.title, .card.themed textarea, .card.themed .img-tools input {
    background:rgba(255,255,255,.07); color:var(--deck-fg); border:1px solid rgba(255,255,255,.16); }
  .card.themed input.title:focus, .card.themed textarea:focus, .card.themed .img-tools input:focus { border-color:var(--deck-accent); }
  .card.themed .img-area { background:rgba(255,255,255,.05); }
  .card.themed .btn-outline { color:var(--deck-accent); border-color:var(--deck-accent); }
  .card.themed .btn-outline:hover { background:rgba(255,255,255,.1); }
  .card.themed .type-badge { background:var(--deck-accent); color:#fff; }

  /* ===== 编辑控件 ===== */
  .col-text { flex:1; min-width:0; }
  .col-img { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .col-text input.title { width:100%; font-size:17px; font-weight:600; padding:8px 10px;
                          border-radius:8px; margin-bottom:12px; }
  .col-text textarea { width:100%; min-height:170px; font-size:14px; padding:8px 10px; line-height:1.9;
                       border-radius:8px; resize:vertical; }
  .img-area { position:relative; min-height:260px; border-radius:8px;
              display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .img-area img { max-width:100%; max-height:360px; border-radius:8px; box-shadow:0 4px 18px rgba(0,0,0,.35); }
  .img-area .placeholder { color:var(--deck-muted); font-size:14px; }
  .spinner { width:34px; height:34px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--deck-accent);
             border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .img-tools { display:flex; gap:8px; }
  .img-tools input { flex:1; padding:6px 10px; font-size:13px; border-radius:8px; }

  /* ===== 版式徽章 & 居中版式 ===== */
  .type-badge { font-size:11px; padding:2px 10px; border-radius:999px; background:var(--deck-accent);
                color:#fff; margin-left:4px; font-weight:700; flex-shrink:0; }
  .card-body.center { flex-direction:column; align-items:center; justify-content:center; gap:16px;
                      padding:48px 20px; text-align:center; }
  .card-body.center input.title { text-align:center; font-size:26px; max-width:620px; }
  .card-body.center .lead { color:var(--deck-muted); font-size:14px; max-width:520px; }
  .chart-css { width:100%; max-width:560px; margin:0 auto; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; }
  .bar-label { width:8rem; text-align:right; color:var(--deck-muted); flex-shrink:0; }
  .bar-track { flex:1; background:rgba(255,255,255,.12); border-radius:6px; height:22px; overflow:hidden; }
  .bar { display:block; height:100%; background:var(--deck-accent); border-radius:6px; }
  /* 时间线 & 对比预览 */
  .timeline-css { display:flex; position:relative; padding-top:22px; width:100%; max-width:760px; margin:0 auto; }
  .timeline-css::before { content:""; position:absolute; top:10px; left:4%; right:4%; height:3px; background:var(--deck-accent); }
  .tl-node { flex:1; text-align:center; position:relative; padding:0 4px; }
  .tl-dot { width:12px; height:12px; border-radius:50%; background:var(--deck-accent); margin:0 auto 8px; border:2px solid var(--deck-bg); }
  .tl-node span { font-size:12px; color:var(--deck-fg); display:block; line-height:1.5; }
  .compare-css { display:flex; gap:16px; width:100%; max-width:760px; margin:0 auto; }
  .cmp-col { flex:1; border-top:3px solid var(--deck-accent); padding-top:12px; text-align:left; }
  .cmp-col div { font-size:13px; color:var(--deck-muted); padding:4px 0; }

  /* ===== toast ===== */
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#111827;
           color:#f9fafb; padding:12px 22px; border-radius:10px; font-size:14px; display:none;
           z-index:99; max-width:80vw; word-break:break-all; box-shadow:0 8px 30px rgba(0,0,0,.28); }
  /* 对话修改工具条 + 校验徽章 */
  .refine-bar { display:flex; gap:10px; margin-bottom:24px; }
  .refine-bar input { flex:1; padding:10px 14px; font-size:14px; color:var(--fg); background:#fff;
                      border:1px solid var(--border); border-radius:10px; }
  .refine-bar input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
  .review-badge { font-size:11px; padding:2px 10px; border-radius:999px; margin-left:8px; font-weight:700; flex-shrink:0; }
  .review-badge.ok { background:rgba(22,163,74,.15); color:var(--ok); }
  .review-badge.regenerated { background:rgba(217,119,6,.15); color:var(--warn); }
  .review-badge.fail { background:rgba(220,38,38,.15); color:var(--danger); }
</style>
</head>
<body>
<div class="topbar">
  <h1><span class="dot"></span>PPT 制作台</h1>
  <input id="topic" placeholder="输入主题，如：青少年为什么要学编程" />
  <select id="theme">
    <option value="blue">海洋蓝</option>
    <option value="dark">石墨金</option>
    <option value="green">墨绿</option>
  </select>
  <button class="btn-primary" id="btn-gen" onclick="doGenerate()">生成</button>
  <button class="btn-outline" id="btn-import" onclick="document.getElementById('file-input').click()">导入文档</button>
  <input type="file" id="file-input" accept=".md,.txt,.docx" style="display:none" onchange="doImport(this)" />
  <button class="btn-outline" id="btn-export" onclick="doExport()" disabled>导出 pptx</button>
  <button class="btn-outline" id="btn-export-html" onclick="doExportHtml()" disabled>导出 HTML</button>
  <button class="btn-outline" id="btn-export-txt" onclick="doExportTxt()" disabled>导出大纲</button>
  <button class="btn-outline" id="btn-export-pdf" onclick="doExportPdf()" disabled>导出 PDF</button>
</div>
<div class="main">
  <div class="progress">
    <div class="steps">
      <span class="step" id="step-outline">大纲生成</span>
      <span class="step" id="step-images">逐页生图</span>
      <span class="step" id="step-ready">编辑导出</span>
    </div>
    <div id="log"></div>
  </div>
  <div class="refine-bar">
    <input id="instruction" placeholder="对话修改，如：把第 3 页改得更简洁 / 整篇换成商务风格" />
    <button class="btn-outline" id="btn-refine" onclick="doRefine()" disabled>修改</button>
  </div>
  <div id="cards"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let polling = null;

const THEMES_JS = {
  blue:  {bg:'#0f2a4a', accent:'#3b82f6', fg:'#ffffff', muted:'#b6c7dc'},
  dark:  {bg:'#111827', accent:'#f59e0b', fg:'#f9fafb', muted:'#9ca3af'},
  green: {bg:'#062e21', accent:'#22c55e', fg:'#ecfdf5', muted:'#a7c4b6'},
};

const TYPE_LABEL = {cover:'封面', toc:'目录', section:'章节', content:'图文', data:'图表', timeline:'时间线', compare:'对比', end:'总结'};
const LAYOUT_LABEL = { 'image-right':'左文右图', 'image-left':'左图右文', 'image-top':'上图下文',
  'image-full':'全宽图', 'cards':'三栏卡片', 'columns':'两栏', 'center':'居中' };

function applyTheme(name) {
  const t = THEMES_JS[name] || THEMES_JS.blue;
  const el = document.getElementById('cards');
  el.style.setProperty('--deck-bg', t.bg);
  el.style.setProperty('--deck-fg', t.fg);
  el.style.setProperty('--deck-muted', t.muted);
  el.style.setProperty('--deck-accent', t.accent);
}

function chartHtml(chart) {
  const labels = chart?.labels || [], values = (chart?.values || []).map(v => Number(v) || 0);
  const mx = Math.max(...values, 1);
  return '<div class="chart-css">' + labels.map((l, i) =>
    `<div class="bar-row"><span class="bar-label">${esc(l)}</span>
     <span class="bar-track"><span class="bar" style="width:${values[i]/mx*100}%"></span></span>
     <span class="bar-val">${values[i]}</span></div>`).join('') + '</div>';
}

function timelineHtml(points) {
  return '<div class="timeline-css">' + points.map(p =>
    `<div class="tl-node"><div class="tl-dot"></div><span>${esc(p)}</span></div>`).join('') + '</div>';
}

function compareHtml(points) {
  const mid = Math.ceil(points.length / 2);
  const col = items => '<div class="cmp-col">' + items.map(p => `<div>▸ ${esc(p)}</div>`).join('') + '</div>';
  return '<div class="compare-css">' + col(points.slice(0, mid)) + col(points.slice(mid)) + '</div>';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, ms = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', ms);
}

async function doGenerate() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { toast('请先输入主题'); return; }
  const theme = document.getElementById('theme').value;
  const r = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'},
                                           body: JSON.stringify({topic, theme})});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  document.getElementById('btn-gen').disabled = true;
  setExportButtons(true);
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
  refresh();
}

function setExportButtons(disabled) {
  ['btn-export', 'btn-export-html', 'btn-export-txt', 'btn-export-pdf'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
}

async function refresh() {
  const r = await fetch('/api/status');
  const s = await r.json();
  renderSteps(s.phase);
  renderLog(s.log);
  applyTheme(s.theme);
  renderCards(s);
  if (s.phase === 'idle' || s.phase === 'ready') {
    if (polling) { clearInterval(polling); polling = null; }
    document.getElementById('btn-gen').disabled = false;
    const canExport = s.phase === 'ready' && s.slides.length > 0;
    setExportButtons(!canExport);
    document.getElementById('btn-refine').disabled = !canExport;
    if (s.phase === 'ready' && !s.slides.length) { /* 保留 */ }
    if (s.phase === 'idle' && s.log.length && s.slides.length === 0) {
      const last = s.log[s.log.length - 1];
      if (last.msg.startsWith('生成中断')) toast('生成失败：' + last.msg, 6000);
    }
  }
}

async function doRefine() {
  const instruction = document.getElementById('instruction').value.trim();
  if (!instruction) { toast('请输入修改指令'); return; }
  const r = await fetch('/api/refine', {method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({instruction})});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  document.getElementById('btn-refine').disabled = true;
  document.getElementById('btn-gen').disabled = true;
  setExportButtons(true);
  document.getElementById('instruction').value = '';
  toast('正在按指令修改…');
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
  refresh();
}

function renderSteps(phase) {
  const m = {'outline': ['active','',''], 'images': ['done','active',''],
             'refining': ['done','done','active'], 'ready': ['done','done','done']};
  const v = m[phase] || ['','',''];
  ['step-outline','step-images','step-ready'].forEach((id, i) => {
    document.getElementById(id).className = 'step ' + v[i];
  });
}

function renderLog(log) {
  const el = document.getElementById('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  el.innerHTML = log.map(l => `<div>[${l.time}] ${esc(l.msg)}</div>`).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function renderCards(s) {
  const wrap = document.getElementById('cards');
  const sig = s.phase + '|' + s.slides.map(x => x.type + x.title + x.imageStatus + (x.image||'') + x.points.join('§') + JSON.stringify(x.chart||'')).join('¶');
  if (wrap.dataset.sig === sig) return;
  wrap.dataset.sig = sig;

  if (document.activeElement && wrap.contains(document.activeElement) &&
      !['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;

  wrap.innerHTML = s.slides.map((sl, i) => {
    const stype = sl.type || 'content';
    const label = TYPE_LABEL[stype] || '图文';
    let imgHtml;
    if (sl.imageStatus === 'generating') imgHtml = '<div class="spinner"></div>';
    else if (sl.image) imgHtml = `<img src="${sl.image}" alt="页${i+1}">`;
    else imgHtml = `<div class="placeholder">${sl.imageStatus === 'failed' ? '（图片生成失败）' : '（无图）'}</div>`;

    const imgTools = stype === 'content' ? `
      <div class="img-tools">
        <input id="prompt-${i}" placeholder="自定义图片描述（可留空）" value="${esc(sl.image_prompt)}">
        <button class="btn-outline btn-sm" onclick="regenImage(${i})" ${sl.imageStatus==='generating'?'disabled':''}>换一张图</button>
      </div>` : '';

    let body;
    if (stype === 'cover') {
      body = `<div class="card-body cover"><input class="title" id="title-${i}" value="${esc(sl.title)}">${imgHtml}</div>`;
    } else if (stype === 'toc') {
      body = `<div class="card-body"><input class="title" id="title-${i}" value="${esc(sl.title)}">
        <textarea id="points-${i}" placeholder="每行一个章节标题">${esc(sl.points.join('\n'))}</textarea></div>`;
    } else if (stype === 'section') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">
        <div class="lead">${esc(sl.points[0] || '')}</div></div>`;
    } else if (stype === 'data') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">${chartHtml(sl.chart)}</div>`;
    } else if (stype === 'timeline') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">${timelineHtml(sl.points)}</div>`;
    } else if (stype === 'compare') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">${compareHtml(sl.points)}</div>`;
    } else if (stype === 'end') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}"></div>`;
    } else {
      const noImg = ['cards', 'columns', 'center'].includes(sl.layout);
      const ptsPh = '每行一个要点（标题：描述）';
      const textCol = `<div class="col-text">
        <input class="title" id="title-${i}" value="${esc(sl.title)}">
        <textarea id="points-${i}" placeholder="${ptsPh}">${esc(sl.points.join('\n'))}</textarea></div>`;
      body = noImg
        ? `<div class="card-body">${textCol}</div>`
        : `<div class="card-body">${textCol}<div class="col-img"><div class="img-area">${imgHtml}</div>${imgTools}</div></div>`;
    }
    const layoutBadge = LAYOUT_LABEL[sl.layout] ? ` <span class="type-badge">${LAYOUT_LABEL[sl.layout]}</span>` : '';
    return `<div class="card themed">
      <div class="card-head">页 ${i + 1} · <span class="type-badge">${label}</span>${layoutBadge} ${esc(sl.title)}${reviewBadge(sl)}
        <button class="btn-outline btn-sm" onclick="saveText(${i})">保存文字</button></div>
      ${body}
    </div>`;
  }).join('');
}

function reviewBadge(sl) {
  const rv = sl.review || {};
  if (rv.tries > 0 && rv.ok) return '<span class="review-badge regenerated">已重生</span>';
  if (rv.tries >= 2 && !rv.ok) return '<span class="review-badge fail">未契合</span>';
  if (sl.imageStatus === 'done') return '<span class="review-badge ok">✓ 契合</span>';
  return '';
}

async function saveText(i) {
  const title = document.getElementById('title-' + i).value;
  const ptsEl = document.getElementById('points-' + i);
  const points = ptsEl ? ptsEl.value.split('\n').map(x => x.trim()).filter(Boolean) : [];
  const r = await fetch(`/api/slide/${i}/text`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({title, points})});
  if (r.ok) toast(`页 ${i + 1} 文字已保存`);
  else toast((await r.json()).error);
}

async function regenImage(i) {
  const prompt = document.getElementById('prompt-' + i).value;
  const r = await fetch(`/api/slide/${i}/image`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                   body: JSON.stringify({prompt})});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast(`页 ${i + 1} 正在重新生图…`);
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
}

async function doExport() {
  const r = await fetch('/api/export', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast('已导出：' + d.path, 8000);
}

async function doExportHtml() {
  const r = await fetch('/api/export_html', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast('已导出 HTML：' + d.path, 8000);
  window.open(d.path.replace(/\\/g, '/'), '_blank');
}

async function doImport(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('theme', document.getElementById('theme').value);
  toast('正在解析文档…');
  const r = await fetch('/api/import_file', {method:'POST', body: fd});
  const d = await r.json();
  if (!r.ok) { toast(d.error || '导入失败'); return; }
  input.value = '';
  toast('正在从文档生成 PPT…');
  document.getElementById('btn-gen').disabled = true;
  setExportButtons(true);
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
  refresh();
}

async function doExportTxt() {
  const r = await fetch('/api/export_txt', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast('已导出大纲：' + d.path, 8000);
}

async function doExportPdf() {
  const r = await fetch('/api/export_pdf', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error || 'PDF 导出失败', 5000); return; }
  toast('已导出 PDF：' + d.path, 8000);
}
</script>
</body>
</html>
