<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT 制作台</title>
<style>
/* ===== 设计 token（方案 A 专业工作台：中性石墨 + 青瓷强调，弃靛蓝）===== */
:root {
  --bg:#f7f7f8; --surface:#ffffff; --raised:#fbfbfc; --border:#e4e4e7;
  --fg:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --accent:#0d9488; --accent-hover:#0f766e; --accent-soft:rgba(13,148,136,.09);
  --ok:#15803d; --warn:#b45309; --danger:#b91c1c;
  --r-lg:10px; --r:8px;
  --sidebar-w:248px;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Code","Consolas",monospace;
  --t:.15s ease-out;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#09090b; --surface:#141416; --raised:#1c1c1f; --border:#27272a;
    --fg:#fafafa; --muted:#a1a1aa; --faint:#71717a;
    --accent:#14b8a6; --accent-hover:#2dd4bf; --accent-soft:rgba(20,184,166,.12);
    --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  }
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans);
       font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
::selection { background:var(--accent-soft); }
button, input, select, textarea { font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
svg { flex-shrink:0; }
/* ===== 布局：固定侧栏 + 主工作区 ===== */
.layout { display:flex; min-height:100vh; }
.sidebar { width:var(--sidebar-w); flex-shrink:0; background:var(--surface);
           border-right:1px solid var(--border); display:flex; flex-direction:column;
           position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { display:flex; align-items:center; gap:9px; padding:20px 20px 16px;
         font-size:15px; font-weight:700; letter-spacing:-.01em; }
.brand svg { color:var(--accent); }
.side-sec { padding:0 12px 8px; }
.side-label { padding:10px 8px 6px; font-size:11px; font-weight:600; color:var(--faint);
              letter-spacing:.06em; text-transform:uppercase; }
/* 品牌模板表单（阶段三 #6） */
.brand-sec { display:flex; flex-direction:column; gap:6px; }
.brand-sec input { width:100%; padding:6px 9px; font-size:12px; color:var(--fg);
                   background:var(--surface-2, #f7f7fb); border:1px solid var(--border);
                   border-radius:var(--r); }
.brand-sec input[type="color"] { padding:2px; height:30px; flex:0 0 44px; cursor:pointer; }
.brand-row { display:flex; gap:6px; align-items:center; }
.brand-row .side-item { padding:6px 8px; font-size:12px; }
.side-item { display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px;
             border:none; background:none; border-radius:var(--r); cursor:pointer;
             color:var(--muted); text-align:left; transition:background var(--t), color var(--t); }
.side-item:hover { background:var(--accent-soft); color:var(--fg); }
.side-item.primary { background:var(--accent); color:#fff; font-weight:600; }
.side-item.primary:hover { background:var(--accent-hover); }
.side-item span.meta { margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--mono); }
.side-item .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-item:disabled { opacity:.4; cursor:not-allowed; }
a.side-item { text-decoration:none; color:var(--muted); }
a.side-item:hover { color:var(--fg); }
/* 侧栏分组：三组列表可折叠，整体随侧栏滚动，避免内容变多后挤压 */
.side-grp { padding:0 12px; }
.side-grp > summary.side-label { cursor:pointer; list-style:none; display:flex;
                                 align-items:center; gap:6px; user-select:none; }
.side-grp > summary.side-label::-webkit-details-marker { display:none; }
.side-grp > summary.side-label::after { content:""; width:8px; height:8px; margin-left:auto;
  border-right:1.5px solid var(--faint); border-bottom:1.5px solid var(--faint);
  transform:rotate(-45deg); transition:transform var(--t); }
.side-grp[open] > summary.side-label::after { transform:rotate(45deg); }
.grp-body { max-height:216px; overflow-y:auto; padding-bottom:4px; }
.grp-body:empty::after { content:"暂无记录"; display:block; padding:6px 10px;
                         font-size:12px; color:var(--faint); }
.art-kind { font-size:10px; font-family:var(--mono); color:var(--muted);
            border:1px solid var(--border); border-radius:4px; padding:0 4px; flex-shrink:0; }
/* 模板 / 风格选择 */
.tpl-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
.tpl-chip { display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer;
            border:1px solid var(--border); border-radius:var(--r); background:var(--bg);
            font-size:12px; color:var(--fg); transition:border-color var(--t); text-align:left; }
.tpl-chip:hover { border-color:var(--accent); }
.tpl-chip.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
.tpl-sw { width:14px; height:14px; border-radius:4px; flex-shrink:0; }
.tpl-chip .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tpl-del { margin-left:auto; color:var(--muted); font-size:13px; line-height:1; padding:2px 4px; border-radius:4px; flex-shrink:0; }
.tpl-del:hover { color:#e5484d; background:rgba(229,72,77,.12); }
.model-grid { display:flex; flex-direction:column; gap:6px; padding:6px 2px; }
.model-grid label { display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--muted); }
.model-grid input { padding:5px 8px; border:1px solid var(--border,#2a3548); border-radius:6px;
  background:transparent; color:inherit; font-size:12px; }
.model-grid input:focus { outline:none; border-color:var(--accent); }
.model-btns { display:flex; gap:6px; }
.model-btns .side-item { flex:1; justify-content:center; font-size:12px; }
#model-panel summary { cursor:pointer; font-size:12.5px; padding:6px 8px; color:var(--muted); }
#model-panel summary:hover { color:var(--accent); }
.density-sel { padding:5px 8px; border:1px solid var(--border,#2a3548); border-radius:6px;
  background:transparent; color:inherit; font-size:12.5px; cursor:pointer; }
.density-sel:focus { outline:none; border-color:var(--accent); }
.tpl-current { font-size:11.5px; color:var(--muted); padding:4px 2px; }
.tpl-current b { color:var(--accent); }
.side-foot { border-top:1px solid var(--border); padding:10px 12px; }
.workspace { flex:1; min-width:0; display:flex; flex-direction:column; }
/* ===== 顶栏（瘦身：仅输入 + 生成）===== */
.topbar { display:flex; align-items:center; gap:10px; padding:14px 28px;
          background:var(--surface); border-bottom:1px solid var(--border);
          position:sticky; top:0; z-index:20; }
.field { flex:1; display:flex; align-items:center; gap:8px; padding:0 12px;
         background:var(--bg); border:1px solid var(--border); border-radius:var(--r);
         transition:border-color var(--t), box-shadow var(--t); }
.field:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.field svg { color:var(--faint); }
.field input { flex:1; padding:9px 0; border:none; background:none; outline:none; }
.field input::placeholder { color:var(--faint); }
.pill-badge { display:none; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
              background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600;
              white-space:nowrap; }
/* ===== 按钮 ===== */
.btn { display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--r);
       border:1px solid transparent; cursor:pointer; font-weight:500; white-space:nowrap;
       transition:background var(--t), border-color var(--t), color var(--t), opacity var(--t); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn-primary { background:var(--accent); color:#fff; font-weight:600; }
.btn-primary:not(:disabled):hover { background:var(--accent-hover); }
.btn-ghost { background:transparent; border-color:var(--border); color:var(--fg); }
.btn-ghost:not(:disabled):hover { background:var(--accent-soft); border-color:var(--accent); }
.btn-sm { padding:5px 11px; font-size:13px; }
/* ===== 导出下拉（原生 details，零 JS 依赖）===== */
.menu { position:relative; }
.menu > summary { list-style:none; cursor:pointer; }
.menu > summary::-webkit-details-marker { display:none; }
.menu[open] > summary .chev { transform:rotate(180deg); }
.chev { transition:transform var(--t); }
.menu-body { position:absolute; right:0; bottom:calc(100% + 6px); min-width:180px; z-index:30;
             background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
             box-shadow:0 12px 32px rgba(0,0,0,.14); padding:6px; }
.menu-body button { display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px;
                    border:none; background:none; border-radius:6px; cursor:pointer;
                    color:var(--fg); text-align:left; transition:background var(--t); }
.menu-body button:hover:not(:disabled) { background:var(--accent-soft); }
.menu-body button:disabled { opacity:.4; cursor:not-allowed; }
/* ===== 主区容器 ===== */
.main { flex:1; padding:28px; max-width:1180px; width:100%; margin:0 auto; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); }
.stepwise-toggle { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--muted);
                   white-space:nowrap; cursor:pointer; user-select:none; }
.stepwise-toggle input { accent-color:var(--accent); cursor:pointer; }
/* 分步确认审阅横幅 */
.review-banner { display:flex; align-items:center; gap:10px; margin-top:12px; padding:11px 14px;
                 border:1px solid var(--warn); border-radius:var(--r);
                 background:color-mix(in srgb, var(--warn) 10%, transparent); font-size:13.5px; }
.review-banner svg { color:var(--warn); }
.rb-txt { font-weight:600; }
/* ===== 首屏引导（未生成时）===== */
.hero { display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding:80px 24px; gap:14px; }
.hero .icon { width:52px; height:52px; border-radius:14px; background:var(--accent-soft);
              color:var(--accent); display:flex; align-items:center; justify-content:center; }
.hero h2 { margin:6px 0 0; font-size:20px; font-weight:700; letter-spacing:-.01em; }
.hero p { margin:0; color:var(--muted); max-width:440px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.chip { padding:6px 13px; border-radius:999px; border:1px solid var(--border);
        background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px;
        transition:border-color var(--t), color var(--t), background var(--t); }
.chip:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
/* ===== 进度区（真实进度条 + 阶段）===== */
#progress { margin-bottom:20px; padding:16px 20px; }
.track { height:3px; background:var(--border); border-radius:999px; overflow:hidden; margin-bottom:14px; }
.track > i { display:block; height:100%; width:0; border-radius:999px;
             background:linear-gradient(90deg,var(--accent),var(--accent-hover));
             transition:width .45s cubic-bezier(.4,0,.2,1); }
.stages { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.stage { display:flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px;
         font-size:12.5px; color:var(--faint); background:var(--bg); border:1px solid transparent; }
.stage .n { width:16px; height:16px; border-radius:50%; border:1.5px solid currentColor;
            display:flex; align-items:center; justify-content:center; font-size:10px;
            font-family:var(--mono); flex-shrink:0; }
.stage.active { color:var(--accent); background:var(--accent-soft);
                border-color:var(--accent); font-weight:600; }
.stage.active .n { border-style:dashed; animation:spin 2.4s linear infinite; }
.stage.done { color:var(--ok); background:transparent; }
.stage.done .n { border-color:var(--ok); background:var(--ok); color:var(--surface); }
@keyframes spin { to { transform:rotate(360deg); } }
/* ===== 日志（等宽 + 可折叠）===== */
.log-wrap { margin-top:12px; border-top:1px solid var(--border); padding-top:10px; }
.log-wrap[open] summary .chev { transform:rotate(180deg); }
.log-wrap summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px;
                    font-size:12px; color:var(--muted); }
.log-wrap summary::-webkit-details-marker { display:none; }
#log { margin-top:8px; max-height:150px; overflow-y:auto; font-family:var(--mono);
       font-size:11.5px; line-height:1.75; color:var(--muted); }
#log b { color:var(--faint); font-weight:400; margin-right:7px; }
/* ===== AI 设计稿预览 ===== */
#deck-preview { margin-bottom:20px; }
/* 左右分栏工作区：左编辑、右放映（结果出来后启用） */
.workarea { margin-top:4px; }
.workarea.split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
                  gap:22px; align-items:start; }
.workarea.split .col-show { position:sticky; top:24px; }
.workarea.split .col-show #deck-preview { margin-bottom:0; }
.workarea.split .deck-frame { height:calc(100vh - 96px); }
@media (max-width:1100px) {
  .workarea.split { grid-template-columns:1fr; }
  .workarea.split .col-show { position:static; order:-1; }  /* 窄屏放映挪到上方 */
  .workarea.split .deck-frame { height:60vh; }
}
.sec-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sec-head h3 { margin:0; font-size:13px; font-weight:600; letter-spacing:.02em;
               color:var(--muted); display:flex; align-items:center; gap:7px; }
.sec-head h3 svg { color:var(--accent); }
.sec-head .sp { flex:1; }
.deck-frame { display:block; width:100%; height:74vh; border:1px solid var(--border);
              border-radius:var(--r-lg); background:#0f172a;
              box-shadow:0 8px 30px rgba(0,0,0,.10); }
/* ===== 对话修改条 ===== */
.refine { display:flex; gap:10px; margin-bottom:20px; }
/* ===== 页面编辑卡片 ===== */
#cards { --deck-bg:#1a1d26; --deck-fg:#e8eaf0; --deck-muted:#8b93a3; --deck-accent:#0d9488; }
.card { border:1px solid var(--border); border-radius:var(--r-lg); margin-bottom:14px;
        overflow:hidden; background:var(--deck-bg); color:var(--deck-fg);
        transition:border-color var(--t); }
.card:hover { border-color:var(--deck-accent); }
.card-head { display:flex; align-items:center; gap:8px; padding:9px 16px; font-size:13px;
             background:rgba(0,0,0,.16); border-bottom:1px solid rgba(255,255,255,.09); }
.card-head .no { font-family:var(--mono); color:var(--deck-muted); flex-shrink:0; }
.card-head .ttl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.card-head .sp { flex:1; }
.card-body { padding:18px; display:flex; gap:20px; }
.card-body.center { flex-direction:column; align-items:center; justify-content:center;
                    gap:14px; padding:44px 20px; text-align:center; }
.tag { padding:2px 9px; border-radius:999px; background:var(--deck-accent); color:#fff;
       font-size:10.5px; font-weight:700; flex-shrink:0; letter-spacing:.02em; }
.tag.sub { background:rgba(255,255,255,.14); color:var(--deck-fg); }
.chk { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px;
       font-size:10.5px; font-weight:600; flex-shrink:0; }
.chk.ok { background:rgba(34,197,94,.16); color:#4ade80; }
.chk.re { background:rgba(251,191,36,.16); color:#fbbf24; }
.chk.no { background:rgba(248,113,113,.16); color:#f87171; }
.card .btn-ghost { border-color:rgba(255,255,255,.2); color:var(--deck-fg); }
.card .btn-ghost:hover { background:rgba(255,255,255,.1); border-color:var(--deck-accent); }
/* ===== 卡片内编辑控件 ===== */
.col-text { flex:1; min-width:0; }
.col-img { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.card input.title, .card textarea, .card .img-tools input {
  width:100%; background:rgba(255,255,255,.06); color:var(--deck-fg);
  border:1px solid rgba(255,255,255,.14); border-radius:var(--r); padding:8px 11px; outline:none;
  transition:border-color var(--t); }
.card input.title { font-size:16px; font-weight:600; margin-bottom:10px; }
.card textarea { min-height:150px; line-height:1.85; resize:vertical; font-size:13.5px; }
.card .img-tools input { font-size:12.5px; padding:6px 10px; }
.card input:focus, .card textarea:focus { border-color:var(--deck-accent); }
.card-body.center input.title { text-align:center; font-size:22px; max-width:600px; margin:0; }
.lead { color:var(--deck-muted); font-size:13px; max-width:520px; }
.img-area { position:relative; min-height:230px; border-radius:var(--r);
            background:rgba(255,255,255,.04); display:flex; align-items:center;
            justify-content:center; overflow:hidden; }
.img-area img { max-width:100%; max-height:330px; border-radius:6px;
                box-shadow:0 6px 22px rgba(0,0,0,.4); }
.img-area .ph { color:var(--deck-muted); font-size:13px; }
.loader { width:30px; height:30px; border:2.5px solid rgba(255,255,255,.14);
          border-top-color:var(--deck-accent); border-radius:50%; animation:spin .9s linear infinite; }
.img-tools { display:flex; gap:8px; }
/* ===== 预览内的图表 / 时间线 / 对比 ===== */
.viz { width:100%; max-width:560px; margin:0 auto; }
.bar-row { display:flex; align-items:center; gap:10px; margin-bottom:11px; font-size:13px; }
.bar-label { width:7.5rem; text-align:right; color:var(--deck-muted); flex-shrink:0; }
.bar-track { flex:1; height:20px; background:rgba(255,255,255,.1); border-radius:5px; overflow:hidden; }
.bar-track > i { display:block; height:100%; background:var(--deck-accent); border-radius:5px; }
.bar-val { width:2.6rem; font-family:var(--mono); font-size:12px; }
.tl { display:flex; position:relative; padding-top:20px; width:100%; max-width:760px; margin:0 auto; }
.tl::before { content:""; position:absolute; top:9px; left:4%; right:4%; height:2px;
              background:var(--deck-accent); }
.tl-node { flex:1; text-align:center; padding:0 5px; }
.tl-dot { width:11px; height:11px; border-radius:50%; background:var(--deck-accent);
          margin:0 auto 9px; border:2px solid var(--deck-bg); }
.tl-node span { font-size:11.5px; line-height:1.5; display:block; }
.cmp { display:flex; gap:16px; width:100%; max-width:760px; margin:0 auto; }
.cmp-col { flex:1; border-top:2px solid var(--deck-accent); padding-top:11px; text-align:left; }
.cmp-col div { font-size:12.5px; color:var(--deck-muted); padding:3px 0; }
/* ===== toast ===== */
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(8px);
         background:var(--fg); color:var(--bg); padding:11px 20px; border-radius:var(--r);
         font-size:13px; z-index:99; max-width:min(70vw,620px); word-break:break-all;
         box-shadow:0 10px 34px rgba(0,0,0,.3); opacity:0; pointer-events:none;
         transition:opacity var(--t), transform var(--t); }
#toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
@media (max-width:960px) {
  .sidebar { display:none; }
  .main { padding:18px; }
}
/* ===== 弹层查看器（原生 dialog：ESC / 焦点管理 / 无障碍语义自带） ===== */
.modal { border:none; background:transparent; padding:0; margin:auto;
         width:min(1180px, 92vw); max-height:92vh; overflow:visible; color:var(--fg); }
.modal::backdrop { background:rgba(9,9,11,.55); }
.modal-frame { display:flex; flex-direction:column; background:var(--surface);
               border:1px solid var(--border); border-radius:var(--r-lg);
               box-shadow:0 24px 70px rgba(0,0,0,.38); max-height:92vh; overflow:hidden; }
.modal-head { display:flex; align-items:center; gap:10px; padding:11px 14px;
              border-bottom:1px solid var(--border); flex-shrink:0; }
.modal-title { font-size:14px; font-weight:600; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.modal-meta { font-size:12px; color:var(--muted); font-family:var(--mono); flex-shrink:0; }
.modal .sp { flex:1; }
.modal-body { flex:1; min-height:0; display:flex; background:var(--bg); }
.modal-body iframe { flex:1; width:100%; height:min(72vh, 700px); border:none; background:#0f172a; }
.modal-body img { margin:auto; max-width:100%; max-height:82vh; object-fit:contain; padding:16px; }
/* 放映：dialog 全屏时铺满，复用设计稿自带方向键翻页 */
.modal:fullscreen { width:100vw; max-width:100vw; height:100vh; max-height:100vh; margin:0; }
.modal:fullscreen .modal-frame { height:100vh; border-radius:0; border:none; }
.modal:fullscreen .modal-body iframe { height:100%; }
.img-area img { cursor:zoom-in; }
/* ===== AI 协作抽屉（右侧可折叠，默认收起，不挤占主区） ===== */
.aidrawer { position:fixed; top:0; right:0; height:100vh; width:min(360px, 92vw);
            background:var(--surface); border-left:1px solid var(--border);
            box-shadow:-12px 0 34px rgba(0,0,0,.10); z-index:60;
            display:flex; flex-direction:column;
            transform:translateX(100%); transition:transform .2s cubic-bezier(.4,0,.2,1); }
.aidrawer.open { transform:translateX(0); }
.ai-head { display:flex; align-items:center; gap:8px; padding:12px 14px;
           border-bottom:1px solid var(--border); font-size:14px; font-weight:600; }
.ai-head .sp { flex:1; }
.ai-ctx { margin:12px 14px 0; padding:8px 10px; border-radius:var(--r);
          background:var(--accent-soft); border:1px solid var(--accent);
          font-size:12px; color:var(--fg); display:none; align-items:flex-start; gap:8px; }
.ai-ctx.on { display:flex; }
.ai-ctx .txt { flex:1; min-width:0; word-break:break-all; }
.ai-ctx b { color:var(--accent); }
.ai-msgs { flex:1; min-height:0; overflow-y:auto; padding:14px; display:flex;
           flex-direction:column; gap:10px; }
.bub { max-width:88%; padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.65; }
.bub.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.bub.ai { align-self:flex-start; background:var(--raised); border:1px solid var(--border);
          border-bottom-left-radius:4px; white-space:pre-wrap; word-break:break-word; }
.bub.sys { align-self:center; background:none; color:var(--faint); font-size:12px; }
.ai-input { border-top:1px solid var(--border); padding:12px 14px; display:flex;
            flex-direction:column; gap:8px; }
.ai-input textarea { width:100%; min-height:64px; resize:vertical; padding:8px 10px;
                     border:1px solid var(--border); border-radius:var(--r); background:var(--bg);
                     outline:none; font-size:13px; line-height:1.6; }
.ai-input textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.ai-input .row { display:flex; align-items:center; gap:8px; }
.ai-hint { font-size:11.5px; color:var(--faint); }
.ai-hint kbd { font-family:var(--mono); border:1px solid var(--border); border-radius:4px;
               padding:0 4px; background:var(--bg); }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
    </svg>PPT 制作台
  </div>
  <div class="side-sec">
    <button class="side-item primary" onclick="document.getElementById('topic').focus()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建演示
    </button>
    <button class="side-item" onclick="document.getElementById('file-input').click()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      导入文档
    </button>
    <input type="file" id="file-input" accept=".md,.txt,.docx,.pdf" hidden onchange="doImport(this)">
    <button class="side-item" id="btn-ai" onclick="toggleAi()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-5.2 3 1.3 6-4.1-3.3L7.9 19l1.3-6L4 10l6.1-1.2z"/></svg>
      AI 协作
    </button>
  </div>
  <details class="side-grp" open>
    <summary class="side-label">历史设计稿</summary>
    <div class="grp-body" id="deck-list"></div>
  </details>
  <details class="side-grp">
    <summary class="side-label">历史项目</summary>
    <div class="grp-body" id="project-list"></div>
  </details>
  <details class="side-grp">
    <summary class="side-label">导出产物</summary>
    <div class="grp-body" id="artifact-list"></div>
  </details>
  <details class="side-grp" open>
    <summary class="side-label">模板 / 风格</summary>
    <div class="grp-body">
      <div id="tpl-list" class="tpl-grid"></div>
      <button class="side-item" id="tpl-import-btn" onclick="document.getElementById('tpl-file').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l4.5-6 3.5 4 2.5-3 5.5 5M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
        <span class="txt">导入参考稿识别</span>
      </button>
      <input type="file" id="tpl-file" accept=".png,.jpg,.jpeg,.webp,.html" hidden onchange="analyzeReference(this)">
      <button class="side-item" id="tpl-save-btn" onclick="saveCurrentAsTemplate()">
        💾 存当前设计稿为模板
      </button>
      <div class="tpl-current" id="tpl-current">当前：AI 自动选风格</div>
      <details class="side-item" id="model-panel" ontoggle="if(this.open)loadModels()">
        <summary title="切换对话/视觉/生图模型，保存后立即生效">⚙ 模型设置</summary>
        <div class="model-grid">
          <label>对话 / 大纲<input id="model-chat" placeholder="agnes-2.0-flash" spellcheck="false"></label>
          <label>视觉 / 审稿<input id="model-vision" placeholder="agnes-2.5-pro" spellcheck="false"></label>
          <label>生图<input id="model-image" placeholder="agnes-image-2.5-flash" spellcheck="false"></label>
          <div class="model-btns">
            <button class="side-item" onclick="saveModels()">保存并生效</button>
            <button class="side-item" onclick="resetModels()">恢复默认</button>
          </div>
          <div class="tpl-current" id="model-current"></div>
        </div>
      </details>
    </div>
  </details>
  <div class="side-label">品牌模板</div>
  <div class="side-sec brand-sec">
    <input id="brand-name" placeholder="品牌名（可空）" maxlength="20">
    <div class="brand-row">
      <input type="color" id="brand-color" value="#0d9488" title="品牌主色">
      <button class="side-item" onclick="saveBrand()" style="flex:1">应用</button>
      <button class="side-item" onclick="clearBrand()" aria-label="清除品牌模板" title="清除品牌模板">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="side-foot">
    <details class="menu">
      <summary class="side-item" id="export-trigger">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span class="txt">导出</span>
        <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-left:auto"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="menu-body">
        <button id="ex-html" onclick="doExportHtml()" disabled>HTML 演示版</button>
        <button id="ex-anim" onclick="doExportAnim()" disabled>🎞 教学动画</button>
        <button id="ex-vid" onclick="doExportVideo()" disabled>🎬 视频 MP4</button>
        <button id="ex-pptx" onclick="doExport()" disabled>pptx 可编辑版</button>
        <button id="ex-pdf" onclick="doExportPdf()" disabled>PDF 文档</button>
        <button id="ex-txt" onclick="doExportTxt()" disabled>大纲 txt</button>
      </div>
    </details>
  </div>
</aside>

<div class="workspace">
  <header class="topbar">
    <label class="field">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="topic" placeholder="输入演示主题，回车开始生成" onkeydown="if(event.key==='Enter')doGenerate()">
    </label>
    <span class="pill-badge" id="style-badge"></span>
    <label class="stepwise-toggle" title="开启后在大纲、配图两个节点暂停，等你确认再继续">
      <input type="checkbox" id="stepwise-chk" onchange="setStepwise(this.checked)">分步确认
    </label>
    <select id="density-sel" class="density-sel" title="内容详实程度：要点数与每条描述的字数">
      <option value="sparse">精简</option>
      <option value="balanced" selected>标准</option>
      <option value="dense">详实</option>
    </select>
    <button class="btn btn-primary" id="btn-gen" onclick="doGenerate()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3l14 9-14 9V3z"/></svg>
      生成
    </button>
  </header>
  <main class="main">
    <section class="panel" id="progress" hidden>
      <div class="track"><i id="bar"></i></div>
      <div class="stages">
        <span class="stage" id="st-outline"><i class="n">1</i>大纲</span>
        <span class="stage" id="st-images"><i class="n">2</i>配图</span>
        <span class="stage" id="st-design"><i class="n">3</i>AI 设计</span>
        <span class="stage" id="st-ready"><i class="n">4</i>就绪</span>
      </div>
      <details class="log-wrap">
        <summary>
          <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          运行日志
        </summary>
        <div id="log"></div>
      </details>
      <div class="review-banner" id="review-banner" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9l-8 13.9A2 2 0 004 21h16a2 2 0 001.7-3.2l-8-13.9a2 2 0 00-3.4 0z"/></svg>
        <span class="rb-txt" id="review-text"></span>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" onclick="toggleAi(true)">先改改</button>
        <button class="btn btn-primary btn-sm" onclick="doContinue()">继续</button>
      </div>
    </section>
    <div id="hero" class="panel hero">
      <div class="icon">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3l1.9 5.8L20 10l-5.2 3 1.3 6-4.1-3.3L7.9 19l1.3-6L4 10l6.1-1.2z"/></svg>
      </div>
      <h2>让 AI 为你设计演示</h2>
      <p>输入一个主题，AI 会规划大纲、生成配图、判断视觉风格，并自主设计出每页布局各异的幻灯片。</p>
      <div class="chips">
        <button class="chip" onclick="useExample(this)">人工智能如何改变教育</button>
        <button class="chip" onclick="useExample(this)">新能源汽车的发展历程</button>
        <button class="chip" onclick="useExample(this)">如何做好时间管理</button>
      </div>
    </div>
    <div class="workarea" id="workarea">
      <div class="col-edit">
        <div class="refine" id="refine-bar" hidden>
          <label class="field">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <input id="instruction" placeholder="对话修改，如：第 3 页更简洁 / 整篇换商务风格" onkeydown="if(event.key==='Enter')doRefine()">
          </label>
          <button class="btn btn-ghost" id="btn-refine" onclick="doRefine()" disabled>应用修改</button>
          <button class="btn btn-ghost" id="btn-add-slide" onclick="addSlide()" disabled title="在末尾加一页">+ 加页</button>
        </div>
        <div id="cards"></div>
      </div>
      <div class="col-show">
        <div id="deck-preview"></div>
      </div>
    </div>
  </main>
</div>
</div>
<dialog class="modal" id="viewer" aria-labelledby="viewer-title">
  <div class="modal-frame">
    <div class="modal-head">
      <span class="modal-title" id="viewer-title"></span>
      <span class="modal-meta" id="viewer-meta"></span>
      <span class="sp"></span>
      <button class="btn btn-ghost btn-sm" id="viewer-present" onclick="presentDeck()" title="全屏放映（方向键翻页）">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>放映
      </button>
      <button class="btn btn-ghost btn-sm" onclick="openViewerInTab()" title="在新标签打开">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>新标签
      </button>
      <button class="btn btn-ghost btn-sm" onclick="closeViewer()" aria-label="关闭预览">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="viewer-body"></div>
  </div>
</dialog>
<aside class="aidrawer" id="aidrawer" aria-label="AI 协作面板">
  <div class="ai-head">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5.2 3 1.3 6-4.1-3.3L7.9 19l1.3-6L4 10l6.1-1.2z"/></svg>
    AI 协作<span class="sp"></span>
    <button class="btn btn-ghost btn-sm" onclick="toggleAi()" aria-label="收起 AI 面板">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="ai-ctx" id="ai-ctx">
    <span class="txt" id="ai-ctx-txt"></span>
    <button class="btn btn-ghost btn-sm" onclick="clearAiCtx()" aria-label="取消圈选范围">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="ai-msgs" id="ai-msgs"></div>
  <div class="ai-input">
    <textarea id="ai-text" placeholder="说明要改什么，例如：这条要点太长了，缩到 12 个字"
              onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();sendAi();}"></textarea>
    <div class="row">
      <span class="ai-hint"><kbd>Ctrl</kbd>+<kbd>J</kbd> 呼出 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 发送</span>
      <span style="flex:1"></span>
      <button class="btn btn-primary btn-sm" id="ai-send" onclick="sendAi()">发送</button>
    </div>
  </div>
</aside>
<div id="toast"></div>
<script>
let polling = null;

const DECK_THEMES = {
  blue:  {bg:'#0f2a4a', accent:'#3b82f6', fg:'#ffffff', muted:'#b6c7dc'},
  dark:  {bg:'#111827', accent:'#f59e0b', fg:'#f9fafb', muted:'#9ca3af'},
  green: {bg:'#062e21', accent:'#22c55e', fg:'#ecfdf5', muted:'#a7c4b6'},
};
const TYPE_LABEL = {cover:'封面', toc:'目录', section:'章节', content:'图文',
  data:'图表', timeline:'时间线', compare:'对比', end:'总结'};
const LAYOUT_LABEL = {'image-right':'左文右图', 'image-left':'左图右文', 'image-top':'上图下文',
  'image-full':'全宽图', 'cards':'三栏卡片', 'columns':'两栏', 'center':'居中'};
// 进度条百分比：与 renderStages 的阶段映射保持一致
const PHASE_PCT = {idle:0, outline:22, images:52, review:52, designing:80, refining:80, ready:100};
const STEP_LABEL = {outline: '大纲与风格已就绪，确认后开始逐页生图',
                    design: '配图已完成，确认后 AI 开始设计 HTML'};
const EXPORT_IDS = ['ex-html', 'ex-anim', 'ex-vid', 'ex-pptx', 'ex-pdf', 'ex-txt'];

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// URL 白名单：只放行后端产出的静态路径，杜绝内联事件/属性里的注入
function escUrl(u) {
  const s = String(u ?? '');
  return /^\/(decks|images|files)\/[^"'<>\s]*$/.test(s) ? s : '';
}

let toastTimer = null;
function toast(msg, ms = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}

function useExample(btn) {
  $('topic').value = btn.textContent.trim();
  $('topic').focus();
}

function applyDeckTheme(name) {
  const t = DECK_THEMES[name] || DECK_THEMES.blue;
  const el = $('cards');
  el.style.setProperty('--deck-bg', t.bg);
  el.style.setProperty('--deck-fg', t.fg);
  el.style.setProperty('--deck-muted', t.muted);
  el.style.setProperty('--deck-accent', t.accent);
}

function setExports(disabled) {
  EXPORT_IDS.forEach(id => { $(id).disabled = disabled; });
}

function startPolling() {
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
  refresh();
}
async function post(url, body) {
  const opt = {method: 'POST'};
  if (body !== undefined) {
    opt.headers = {'Content-Type': 'application/json'};
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(url, opt);
  return {ok: r.ok, data: await r.json()};
}

async function doGenerate() {
  const topic = $('topic').value.trim();
  if (!topic) { toast('请先输入主题'); return; }
  const {ok, data} = await post('/api/generate', {topic, density: $('density-sel').value});
  if (!ok) { toast(data.error); return; }
  $('btn-gen').disabled = true;
  setExports(true);
  startPolling();
}

async function doImport(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('density', $('density-sel').value);
  toast('正在解析文档…');
  const r = await fetch('/api/import_file', {method: 'POST', body: fd});
  const data = await r.json();
  if (!r.ok) { toast(data.error || '导入失败'); return; }
  input.value = '';
  toast('正在从文档生成演示…');
  $('btn-gen').disabled = true;
  setExports(true);
  startPolling();
}

async function doRefine() {
  const instruction = $('instruction').value.trim();
  if (!instruction) { toast('请输入修改指令'); return; }
  const {ok, data} = await post('/api/refine', {instruction});
  if (!ok) { toast(data.error); return; }
  $('btn-refine').disabled = true;
  $('btn-gen').disabled = true;
  setExports(true);
  $('instruction').value = '';
  toast('正在按指令修改…');
  startPolling();
}

async function doRedesign() {
  const {ok, data} = await post('/api/redesign');
  if (!ok) { toast(data.error); return; }
  toast('AI 正在重新设计…');
  startPolling();
}

async function saveText(i) {
  const title = $('title-' + i).value;
  const ptsEl = $('points-' + i);
  const points = ptsEl ? ptsEl.value.split('\n').map(x => x.trim()).filter(Boolean) : [];
  const {ok, data} = await post(`/api/slide/${i}/text`, {title, points});
  toast(ok ? `第 ${i + 1} 页文字已保存` : data.error);
}

async function regenImage(i) {
  const prompt = $('prompt-' + i).value;
  const {ok, data} = await post(`/api/slide/${i}/image`, {prompt});
  if (!ok) { toast(data.error); return; }
  toast(`第 ${i + 1} 页正在重新生图…`);
  startPolling();
}

// 导出后刷新侧栏产物区，用户可直接点开/下载，不必去翻 toast 里的路径
async function exportAs(url, label) {
  const {ok, data} = await post(url);
  if (!ok) { toast(data.error || (label + ' 导出失败')); return; }
  toast('已导出' + label + '，见侧栏「导出产物」', 5000);
  loadArtifacts();
}
async function doExport()     { exportAs('/api/export', ' pptx'); }
async function doExportAnim() {
  toast('正在生成教学动画（元素级动效）…');
  const {ok, data} = await post('/api/export_animation', {});

async function refresh() {
  const r = await fetch('/api/status');
  const s = await r.json();
  const working = !['idle', 'ready'].includes(s.phase);
  deckCount = s.slides.length;
  // 生成中途刷新页面（F5）后自动恢复轮询（审计 M1）
  if (working && !polling) polling = setInterval(refresh, 1000);

  $('progress').hidden = (s.phase === 'idle' && !s.log.length);
  $('hero').hidden = working || s.slides.length > 0;
  $('refine-bar').hidden = !s.slides.length;
  // 有结果才分左右两栏：左编辑右放映；无结果时单栏（编辑区空、放映区空）
  $('workarea').classList.toggle('split', s.slides.length > 0 && !!s.html_path);

  renderStages(s.phase);
  renderStyleBadge(s);
  renderTplCurrent(s);
  $('stepwise-chk').checked = !!s.stepwise;
  renderLog(s.log);
  renderReviewBanner(s);
  applyDeckTheme(s.theme);
  renderPreview(s);
  renderCards(s);

  if (!working) {
    if (polling) { clearInterval(polling); polling = null; }
    $('btn-gen').disabled = false;
    const canExport = s.phase === 'ready' && s.slides.length > 0;
    setExports(!canExport);
    $('btn-refine').disabled = !canExport;
    $('btn-add-slide').disabled = !canExport;
    if (canExport) { loadDecks(); loadProjects(); loadArtifacts(); }
    if (s.phase === 'idle' && s.log.length && !s.slides.length) {
      const last = s.log[s.log.length - 1];
      if (last.msg.startsWith('生成中断')) toast('生成失败：' + last.msg, 6000);
    }
  }
}

let aiTarget = null;   // {slide, quote?}；quote 为空表示整页

function toggleAi(open) {
  const d = $('aidrawer');
  const next = open === undefined ? !d.classList.contains('open') : open;
  d.classList.toggle('open', next);
  if (next) $('ai-text').focus();
}

function renderAiCtx() {
  const box = $('ai-ctx');
  if (!aiTarget) { box.classList.remove('on'); return; }
  box.classList.add('on');
  const label = `第 ${aiTarget.slide + 1} 页`;
  $('ai-ctx-txt').innerHTML = aiTarget.quote
    ? `只改写 <b>${esc(label)}</b> 中选中的「${esc(aiTarget.quote)}」`
    : `改写整个 <b>${esc(label)}</b>`;
}

function setAiCtx(slide, quote) {
  aiTarget = {slide, quote: quote || undefined};
  renderAiCtx();
  toggleAi(true);
}
function clearAiCtx() { aiTarget = null; renderAiCtx(); }

function aiBubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'bub ' + cls;
  d.textContent = text;
  $('ai-msgs').appendChild(d);
  $('ai-msgs').scrollTop = $('ai-msgs').scrollHeight;
  return d;
}

async function sendAi() {
  const instruction = $('ai-text').value.trim();
  if (!instruction) { toast('请说明要怎么改'); return; }
  const body = {instruction};
  if (aiTarget) body.target = aiTarget;
  const scope = aiTarget
    ? (aiTarget.quote ? `第${aiTarget.slide + 1}页·选中` : `第${aiTarget.slide + 1}页`)
    : '整篇';
  aiBubble('me', `[${scope}] ${instruction}`);
  $('ai-text').value = '';
  $('ai-send').disabled = true;
  const busy = aiBubble('ai', 'AI 正在改写…');
  const {ok, data} = await post('/api/refine', body);
  busy.remove();
  $('ai-send').disabled = false;
  if (!ok) { aiBubble('sys', data.error || '改写失败'); return; }
  aiBubble('sys', aiTarget
    ? '已按圈定范围改写（其余页保持原样），正在重绘受影响部分'
    : '已按指令改写整篇，正在重绘全部配图');
  startPolling();   // 保留 aiTarget，便于连续追问「再短一点」
}

// 在卡片输入框里选中若干文字 → 自动作为改写范围（不弹面板，避免打断）
function bindSelectionCapture() {
  const handler = e => {
    const el = e.target;
    if (!['INPUT', 'TEXTAREA'].includes(el.tagName)) return;
    if (!$('cards').contains(el)) return;
    const {selectionStart: a, selectionEnd: b, value} = el;
    if (typeof a !== 'number' || a === b) return;
    const quote = value.slice(a, b).trim();
    if (!quote) return;
    aiTarget = {slide: Number(el.id.split('-').pop()), quote};
    renderAiCtx();
  };
  $('cards').addEventListener('mouseup', handler);
  $('cards').addEventListener('keyup', handler);
}

function vizChart(chart) {
  const labels = chart?.labels || [];
  const values = (chart?.values || []).map(v => Number(v) || 0);
  const mx = Math.max(...values, 1);
  return '<div class="viz">' + labels.map((l, i) =>
    `<div class="bar-row"><span class="bar-label">${esc(l)}</span>
       <span class="bar-track"><i style="width:${values[i] / mx * 100}%"></i></span>
       <span class="bar-val">${values[i]}</span></div>`).join('') + '</div>';
}

function vizTimeline(points) {
  return '<div class="tl">' + points.map(p =>
    `<div class="tl-node"><div class="tl-dot"></div><span>${esc(p)}</span></div>`).join('') + '</div>';
}

function vizCompare(points) {
  const mid = Math.ceil(points.length / 2);
  const col = items => '<div class="cmp-col">' +
    items.map(p => `<div>${esc(p)}</div>`).join('') + '</div>';
  return '<div class="cmp">' + col(points.slice(0, mid)) + col(points.slice(mid)) + '</div>';
}

function checkBadge(sl) {
  const rv = sl.review || {};
  if (rv.tries > 0 && rv.ok) return '<span class="chk re">已重生</span>';
  if (rv.tries >= 2 && !rv.ok) return '<span class="chk no">未契合</span>';
  if (sl.imageStatus === 'done') return '<span class="chk ok">契合</span>';
  return '';
}

function renderCards(s) {
  const wrap = $('cards');
  const sig = s.phase + '|' + s.slides.map(x =>
    x.type + x.title + x.imageStatus + (x.image || '') + x.points.join('§') +
    JSON.stringify(x.chart || '')).join('¶');
  if (wrap.dataset.sig === sig) return;
  // 正在输入时不重建 DOM，避免丢失未保存的编辑
  if (document.activeElement && wrap.contains(document.activeElement) &&
      ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  wrap.dataset.sig = sig;

  wrap.innerHTML = s.slides.map((sl, i) => {
    const stype = sl.type || 'content';
    const label = TYPE_LABEL[stype] || '图文';
    const layoutTag = LAYOUT_LABEL[sl.layout]
      ? `<span class="tag sub">${LAYOUT_LABEL[sl.layout]}</span>` : '';

    let img;
    if (sl.imageStatus === 'generating') img = '<div class="loader"></div>';
    else if (sl.image) img = `<img src="${escUrl(sl.image)}" data-full="${escUrl(sl.image)}"
                            alt="第 ${i + 1} 页配图" title="点击放大查看">`;
    else img = `<div class="ph">${sl.imageStatus === 'failed' ? '配图生成失败' : '此页无配图'}</div>`;

    const imgTools = stype === 'content' ? `
      <div class="img-tools">
        <input id="prompt-${i}" placeholder="自定义画面描述" value="${esc(sl.image_prompt)}">
        <button class="btn btn-ghost btn-sm" onclick="regenImage(${i})"
          ${sl.imageStatus === 'generating' ? 'disabled' : ''}>换图</button>
      </div>` : '';

    const titleInput = `<input class="title" id="title-${i}" value="${esc(sl.title)}">`;
    const ptsArea = ph => `<textarea id="points-${i}" placeholder="${ph}">${esc(sl.points.join('\n'))}</textarea>`;

    let body;
    if (stype === 'cover') {
      body = `<div class="card-body center">${titleInput}${img}</div>`;
    } else if (stype === 'toc') {
      body = `<div class="card-body"><div class="col-text">${titleInput}${ptsArea('每行一个章节标题')}</div></div>`;
    } else if (stype === 'section') {
      body = `<div class="card-body center">${titleInput}<div class="lead">${esc(sl.points[0] || '')}</div></div>`;
    } else if (stype === 'data') {
      body = `<div class="card-body center">${titleInput}${vizChart(sl.chart)}</div>`;
    } else if (stype === 'timeline') {
      body = `<div class="card-body center">${titleInput}${vizTimeline(sl.points)}</div>`;
    } else if (stype === 'compare') {
      body = `<div class="card-body center">${titleInput}${vizCompare(sl.points)}</div>`;
    } else if (stype === 'end') {
      body = `<div class="card-body center">${titleInput}</div>`;
    } else {
      const textCol = `<div class="col-text">${titleInput}${ptsArea('每行一个要点（标题：描述）')}</div>`;
      const noImg = ['cards', 'columns', 'center'].includes(sl.layout);
      body = noImg
        ? `<div class="card-body">${textCol}</div>`
        : `<div class="card-body">${textCol}
             <div class="col-img"><div class="img-area">${img}</div>${imgTools}</div></div>`;
    }

    return `<article class="card">
      <div class="card-head">
        <span class="no">${String(i + 1).padStart(2, '0')}</span>
        <span class="tag">${label}</span>${layoutTag}
        <span class="ttl">${esc(sl.title)}</span>
        ${checkBadge(sl)}
        <span class="sp"></span>
        <button class="btn btn-ghost btn-sm" onclick="moveSlide(${i},-1)" ${i===0?'disabled':''} title="上移">↑</button>
        <button class="btn btn-ghost btn-sm" onclick="moveSlide(${i},1)" ${i===s.slides.length-1?'disabled':''} title="下移">↓</button>
        <button class="btn btn-ghost btn-sm" onclick="delSlide(${i})" title="删除此页">✕</button>
        <button class="btn btn-ghost btn-sm" onclick="setAiCtx(${i})" title="只让 AI 改写这一页">AI 改这页</button>
        <button class="btn btn-ghost btn-sm" onclick="saveText(${i})">保存</button>
      </div>
      ${body}
    </article>`;
  }).join('');
}

refresh();
loadDecks();
loadProjects();
loadArtifacts();
loadTemplates();
bindSelectionCapture();
// Ctrl/⌘+J 呼出或收起 AI 协作面板
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleAi(); }
});
</script>
