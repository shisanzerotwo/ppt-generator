<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPT 制作台</title>
<style>
  :root {
    --bg:#0d0f14; --panel:#14161d; --card:#1a1d26; --border:#262a35;
    --fg:#e8eaf0; --muted:#8b93a3; --accent:#34d3c4; --ok:#22c55e;
    --warn:#f59e0b; --danger:#ef4444;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Noto Sans SC","Segoe UI","Microsoft YaHei",sans-serif; }
  ::selection { background:rgba(52,211,196,.28); }
  button, input, select, textarea { font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }

  /* ===== 顶栏 ===== */
  .topbar { background:var(--panel); padding:14px 24px; display:flex; align-items:center;
            gap:12px; border-bottom:1px solid var(--border); position:sticky; top:0;
            z-index:10; flex-wrap:wrap; }
  .topbar h1 { font-size:18px; font-weight:600; letter-spacing:.02em; margin:0 14px 0 0; white-space:nowrap;
               color:var(--fg); display:flex; align-items:center; gap:8px; }
  .topbar h1 .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .topbar input#topic { flex:1; min-width:200px; padding:10px 14px; font-size:15px; color:var(--fg);
                        background:var(--card); border:1px solid var(--border); border-radius:8px; }
  .topbar input#topic::placeholder { color:var(--muted); }
  .topbar input#topic:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(52,211,196,.15); }
  .topbar select { padding:9px 10px; color:var(--fg); background:var(--card);
                   border:1px solid var(--border); border-radius:8px; font-size:14px; }

  /* ===== 按钮 ===== */
  button { padding:9px 16px; border:none; border-radius:8px; font-size:14px; cursor:pointer;
           transition:background .15s ease, color .15s ease, border-color .15s ease, opacity .15s ease; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .btn-primary { background:var(--accent); color:#062821; font-weight:600; }
  .btn-primary:not(:disabled):hover { background:#4fe0d2; }
  .btn-outline { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn-outline:not(:disabled):hover { background:rgba(52,211,196,.12); }
  .btn-sm { padding:5px 12px; font-size:13px; border-radius:6px; }

  /* ===== 主区 ===== */
  .main { max-width:1120px; margin:0 auto; padding:24px 24px 60px; }

  /* ===== 进度区 ===== */
  .progress { background:var(--panel); border:1px solid var(--border); border-radius:12px;
              padding:16px 20px; margin-bottom:24px; }
  .steps { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .step { padding:5px 14px; border-radius:999px; font-size:13px; color:var(--muted);
          background:var(--card); border:1px solid var(--border); }
  .step.active { color:var(--accent); border-color:var(--accent); font-weight:600;
                 box-shadow:0 0 0 3px rgba(52,211,196,.14); }
  .step.done { color:var(--ok); border-color:rgba(34,197,94,.4); }
  .step.done::before { content:"✓"; margin-right:5px; color:var(--ok); }
  #log { font-size:13px; color:var(--muted); max-height:120px; overflow-y:auto; line-height:1.7;
         font-variant-numeric:tabular-nums; }
  #log div { padding:1px 0; }

  /* ===== 页面卡片 ===== */
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          margin-bottom:20px; overflow:hidden; transition:border-color .15s ease; }
  .card:hover { border-color:#333a49; }
  .card-head { padding:10px 18px; font-size:14px; color:var(--fg); border-bottom:1px solid var(--border);
               display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-body { padding:20px; display:flex; gap:22px; }
  .card-body.cover { flex-direction:column; align-items:center; padding:36px 20px; }

  /* 预览卡片内部（按 PPT 主题色显示，与深色壳分层） */
  #cards { --deck-bg:#1a1d26; --deck-fg:#e8eaf0; --deck-muted:#8b93a3; --deck-accent:#34d3c4; }
  .card.themed { background:var(--deck-bg); color:var(--deck-fg); box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .card.themed .card-head { color:var(--deck-fg); border-bottom:1px solid rgba(255,255,255,.12); }
  .card.themed:hover { border-color:var(--deck-accent); }
  .card.themed .card-body { border-left:5px solid var(--deck-accent); }
  .card.themed input.title, .card.themed textarea, .card.themed .img-tools input {
    background:rgba(255,255,255,.07); color:var(--deck-fg); border:1px solid rgba(255,255,255,.16); }
  .card.themed input.title:focus, .card.themed textarea:focus { border-color:var(--deck-accent); }
  .card.themed .img-area { background:rgba(255,255,255,.05); }

  /* ===== 编辑控件 ===== */
  .col-text { flex:1; min-width:0; }
  .col-img { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .col-text input.title { width:100%; font-size:17px; font-weight:600; padding:8px 10px;
                          border-radius:6px; margin-bottom:12px; }
  .col-text textarea { width:100%; min-height:170px; font-size:14px; padding:8px 10px; line-height:1.9;
                       border-radius:6px; resize:vertical; }
  .img-area { position:relative; min-height:260px; border-radius:8px;
              display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .img-area img { max-width:100%; max-height:360px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  .img-area .placeholder { color:var(--muted); font-size:14px; }
  .spinner { width:34px; height:34px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent);
             border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .img-tools { display:flex; gap:8px; }
  .img-tools input { flex:1; padding:6px 10px; font-size:13px; border-radius:6px; }

  /* ===== 版式徽章 & 居中版式 ===== */
  .type-badge { font-size:11px; padding:2px 10px; border-radius:999px; background:var(--deck-accent);
                color:#062821; margin-left:4px; font-weight:700; flex-shrink:0; }
  .card-body.center { flex-direction:column; align-items:center; justify-content:center; gap:16px;
                      padding:48px 20px; text-align:center; }
  .card-body.center input.title { text-align:center; font-size:26px; max-width:620px; }
  .card-body.center .lead { color:var(--deck-muted); font-size:14px; max-width:520px; }
  .chart-css { width:100%; max-width:560px; margin:0 auto; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; }
  .bar-label { width:8rem; text-align:right; color:var(--deck-muted); flex-shrink:0; }
  .bar-track { flex:1; background:rgba(255,255,255,.12); border-radius:6px; height:22px; overflow:hidden; }
  .bar { display:block; height:100%; background:var(--deck-accent); border-radius:6px; }

  /* ===== toast ===== */
  .toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:#0a0c10;
           color:var(--fg); border:1px solid var(--border); padding:12px 22px; border-radius:10px;
           font-size:14px; display:none; z-index:99; max-width:80vw; word-break:break-all;
           box-shadow:0 8px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="topbar">
  <h1><span class="dot"></span>PPT 制作台</h1>
  <input id="topic" placeholder="输入主题，如：青少年为什么要学编程" />
  <select id="theme">
    <option value="blue">海洋蓝</option>
    <option value="dark">石墨金</option>
    <option value="green">墨绿</option>
  </select>
  <button class="btn-primary" id="btn-gen" onclick="doGenerate()">生成</button>
  <button class="btn-outline" id="btn-export" onclick="doExport()" disabled>导出 pptx</button>
  <button class="btn-outline" id="btn-export-html" onclick="doExportHtml()" disabled>导出 HTML</button>
</div>
<div class="main">
  <div class="progress">
    <div class="steps">
      <span class="step" id="step-outline">大纲生成</span>
      <span class="step" id="step-images">逐页生图</span>
      <span class="step" id="step-ready">编辑导出</span>
    </div>
    <div id="log"></div>
  </div>
  <div id="cards"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let polling = null;

const THEMES_JS = {
  blue:  {bg:'#0f2a4a', accent:'#3b82f6', fg:'#ffffff', muted:'#b6c7dc'},
  dark:  {bg:'#111827', accent:'#f59e0b', fg:'#f9fafb', muted:'#9ca3af'},
  green: {bg:'#062e21', accent:'#22c55e', fg:'#ecfdf5', muted:'#a7c4b6'},
};

const TYPE_LABEL = {cover:'封面', toc:'目录', section:'章节', content:'图文', data:'图表', end:'总结'};

function applyTheme(name) {
  const t = THEMES_JS[name] || THEMES_JS.blue;
  const el = document.getElementById('cards');
  el.style.setProperty('--deck-bg', t.bg);
  el.style.setProperty('--deck-fg', t.fg);
  el.style.setProperty('--deck-muted', t.muted);
  el.style.setProperty('--deck-accent', t.accent);
}

function chartHtml(chart) {
  const labels = chart?.labels || [], values = chart?.values || [];
  const mx = Math.max(...values, 1);
  return '<div class="chart-css">' + labels.map((l, i) =>
    `<div class="bar-row"><span class="bar-label">${esc(l)}</span>
     <span class="bar-track"><span class="bar" style="width:${values[i]/mx*100}%"></span></span>
     <span class="bar-val">${values[i]}</span></div>`).join('') + '</div>';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, ms = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', ms);
}

async function doGenerate() {
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { toast('请先输入主题'); return; }
  const theme = document.getElementById('theme').value;
  const r = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'},
                                           body: JSON.stringify({topic, theme})});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  document.getElementById('btn-gen').disabled = true;
  document.getElementById('btn-export').disabled = true;
  document.getElementById('btn-export-html').disabled = true;
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
  refresh();
}

async function refresh() {
  const r = await fetch('/api/status');
  const s = await r.json();
  renderSteps(s.phase);
  renderLog(s.log);
  applyTheme(s.theme);
  renderCards(s);
  if (s.phase === 'idle' || s.phase === 'ready') {
    if (polling) { clearInterval(polling); polling = null; }
    document.getElementById('btn-gen').disabled = false;
    document.getElementById('btn-export').disabled = (s.phase !== 'ready' || !s.slides.length);
    document.getElementById('btn-export-html').disabled = (s.phase !== 'ready' || !s.slides.length);
    if (s.phase === 'ready' && !s.slides.length) { /* 保留 */ }
    if (s.phase === 'idle' && s.log.length && s.slides.length === 0) {
      const last = s.log[s.log.length - 1];
      if (last.msg.startsWith('生成中断')) toast('生成失败：' + last.msg, 6000);
    }
  }
}

function renderSteps(phase) {
  const m = {'outline': ['active','',''], 'images': ['done','active',''], 'ready': ['done','done','done']};
  const v = m[phase] || ['','',''];
  ['step-outline','step-images','step-ready'].forEach((id, i) => {
    document.getElementById(id).className = 'step ' + v[i];
  });
}

function renderLog(log) {
  const el = document.getElementById('log');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  el.innerHTML = log.map(l => `<div>[${l.time}] ${esc(l.msg)}</div>`).join('');
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function renderCards(s) {
  const wrap = document.getElementById('cards');
  const sig = s.phase + '|' + s.slides.map(x => x.type + x.title + x.imageStatus + (x.image||'') + x.points.join('§') + JSON.stringify(x.chart||'')).join('¶');
  if (wrap.dataset.sig === sig) return;
  wrap.dataset.sig = sig;

  if (document.activeElement && wrap.contains(document.activeElement) &&
      !['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;

  wrap.innerHTML = s.slides.map((sl, i) => {
    const stype = sl.type || 'content';
    const label = TYPE_LABEL[stype] || '图文';
    let imgHtml;
    if (sl.imageStatus === 'generating') imgHtml = '<div class="spinner"></div>';
    else if (sl.image) imgHtml = `<img src="${sl.image}" alt="页${i+1}">`;
    else imgHtml = `<div class="placeholder">${sl.imageStatus === 'failed' ? '（图片生成失败）' : '（无图）'}</div>`;

    const imgTools = stype === 'content' ? `
      <div class="img-tools">
        <input id="prompt-${i}" placeholder="自定义图片描述（可留空）" value="${esc(sl.image_prompt)}">
        <button class="btn-outline btn-sm" onclick="regenImage(${i})" ${sl.imageStatus==='generating'?'disabled':''}>换一张图</button>
      </div>` : '';

    let body;
    if (stype === 'cover') {
      body = `<div class="card-body cover"><input class="title" id="title-${i}" value="${esc(sl.title)}">${imgHtml}</div>`;
    } else if (stype === 'toc') {
      body = `<div class="card-body"><input class="title" id="title-${i}" value="${esc(sl.title)}">
        <textarea id="points-${i}" placeholder="每行一个章节标题">${esc(sl.points.join('\n'))}</textarea></div>`;
    } else if (stype === 'section') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">
        <div class="lead">${esc(sl.points[0] || '')}</div></div>`;
    } else if (stype === 'data') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}">${chartHtml(sl.chart)}</div>`;
    } else if (stype === 'end') {
      body = `<div class="card-body center"><input class="title" id="title-${i}" value="${esc(sl.title)}"></div>`;
    } else {
      body = `<div class="card-body"><div class="col-text">
        <input class="title" id="title-${i}" value="${esc(sl.title)}">
        <textarea id="points-${i}" placeholder="每行一个要点">${esc(sl.points.join('\n'))}</textarea></div>
        <div class="col-img"><div class="img-area">${imgHtml}</div>${imgTools}</div></div>`;
    }
    return `<div class="card themed">
      <div class="card-head">页 ${i + 1} · <span class="type-badge">${label}</span> ${esc(sl.title)}
        <button class="btn-outline btn-sm" onclick="saveText(${i})">保存文字</button></div>
      ${body}
    </div>`;
  }).join('');
}

async function saveText(i) {
  const title = document.getElementById('title-' + i).value;
  const ptsEl = document.getElementById('points-' + i);
  const points = ptsEl ? ptsEl.value.split('\n').map(x => x.trim()).filter(Boolean) : [];
  const r = await fetch(`/api/slide/${i}/text`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                  body: JSON.stringify({title, points})});
  if (r.ok) toast(`页 ${i + 1} 文字已保存`);
  else toast((await r.json()).error);
}

async function regenImage(i) {
  const prompt = document.getElementById('prompt-' + i).value;
  const r = await fetch(`/api/slide/${i}/image`, {method:'POST', headers:{'Content-Type':'application/json'},
                                                   body: JSON.stringify({prompt})});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast(`页 ${i + 1} 正在重新生图…`);
  if (polling) clearInterval(polling);
  polling = setInterval(refresh, 1000);
}

async function doExport() {
  const r = await fetch('/api/export', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast('已导出：' + d.path, 8000);
}

async function doExportHtml() {
  const r = await fetch('/api/export_html', {method:'POST'});
  const d = await r.json();
  if (!r.ok) { toast(d.error); return; }
  toast('已导出 HTML：' + d.path, 8000);
  window.open(d.path.replace(/\\/g, '/'), '_blank');
}
</script>
</body>
</html>
